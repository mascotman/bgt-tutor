<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;   /* 🔴 textContent เท่านั้น ห้าม innerHTML */
    return n;
  }

  /* 🔴 ค่าคงที่เรื่องเงินมาจากไฟล์กลาง — ห้ามประกาศทับที่นี่ */
  var CONFIG = window.BGT_LESSON_CONFIG;
  var SEED   = window.BGT_LESSON_SEED;

  var STATUS_LABEL = {
    confirmed: 'ยืนยันแล้ว รอถึงเวลา', in_progress: 'กำลังสอน',
    taught: 'รอผู้เรียนยืนยัน', completed: 'เรียบร้อย', disputed: 'ระหว่างตรวจสอบ'
  };
  var MODE_LABEL = { online: 'ออนไลน์', home: 'ที่บ้าน', public: 'สถานที่อื่นๆ' };

  /* ── กระเป๋าสถานะคาบ: ชุดเดียวกับ teacher-jobs.html (localStorage · อายุ 2 ชม.) ──
     🔴 อ่านอย่างเดียว หน้านี้ไม่เขียนสถานะ — คนกดเริ่ม/จบคาบคือหน้าตารางสอน */
  var LESSON_KEY = 'bgt_lessons';
  var LESSON_TTL = 2 * 60 * 60 * 1000;
  function readBox() {
    var raw = null;
    try { raw = localStorage.getItem(LESSON_KEY); } catch (e) { return null; }
    if (!raw) return null;
    var o = null;
    try { o = JSON.parse(raw); } catch (e) { return null; }
    if (!o || o.v !== 1 || !o.lessons || typeof o.lessons !== 'object') return null;
    if (!o.ts || (Date.now() - o.ts) > LESSON_TTL) return null;
    return o;
  }

  function build() {
    var box = readBox();
    var base = Date.now();
    return SEED.map(function (s) {
      var startAt = base + s.offsetMin * 60000;
      var L = {
        id: s.id, jobId: s.jobId, learner: s.learner, subject: s.subject,
        mode: s.mode, len: s.len, price: s.price,
        startAt: startAt, endAt: startAt + s.len * 60000,
        status: s.status, taughtAt: null, closedAt: null, closedBy: null, reason: null
      };
      if (s.status === 'taught') L.taughtAt = base - (s.taughtAgoH || 1) * 3600000;
      if (s.status === 'completed') { L.taughtAt = L.endAt; L.closedAt = L.endAt + 3600000; L.closedBy = s.confirmedBy || 'learner'; }
      var e = box && box.lessons ? box.lessons[s.id] : null;
      if (e && e.status) {
        L.status = e.status;
        if (e.taughtAt != null) L.taughtAt = e.taughtAt;
        if (e.closedAt != null) L.closedAt = e.closedAt;
        if (e.closedBy != null) L.closedBy = e.closedBy;
        if (e.reason  != null) L.reason  = e.reason;
      }
      return L;
    });
  }

  /* ── สูตรเงิน: ต้องเหมือน teacher-jobs.html เป๊ะ ── */
  function gross(L) { return L.price * (L.len / 60); }
  function fee(L)   { return gross(L) * CONFIG.feeSingle; }
  function net(L)   { return Math.round(gross(L) - fee(L)); }
  function baht(n)  { return '฿' + Math.round(n).toLocaleString('th-TH'); }

  var LESSONS = build();

  /* ══════════════════════════════════════════════════════════════════════
     แดชบอร์ดครู (2026-09-04)
     🔴 Owner สั่ง: "ไม่ต้องทำกราฟ ทำเป็นหลอด/ตัวเลข" + "ต้องดูได้ตั้งแต่ 0"
        -> ครูที่ยังไม่มีคาบสักคาบ ต้องเปิดหน้านี้แล้วอ่านรู้เรื่อง ไม่ใช่จอว่าง
     🔴 ตัวเลขทุกตัวคำนวณจากคาบจริงใน shared/lessons-seed.js + สถานะใน localStorage
        ไม่มีตัวเลขไหนพิมพ์ตายไว้เพื่อให้ดูสวย
     ══════════════════════════════════════════════════════════════════════ */
  var TD = window.BGT_TEACHER;

  function ymd(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function startOfDay(iso) { return new Date(iso + 'T00:00:00').getTime(); }
  function endOfDay(iso)   { return new Date(iso + 'T23:59:59.999').getTime(); }

  function presetRange(kind) {
    var t = new Date();
    if (kind === 'today')      return [ymd(t), ymd(t)];
    if (kind === '7d')         return [ymd(new Date(t.getFullYear(), t.getMonth(), t.getDate() - 6)), ymd(t)];
    if (kind === 'this-month') return [ymd(new Date(t.getFullYear(), t.getMonth(), 1)), ymd(new Date(t.getFullYear(), t.getMonth() + 1, 0))];
    if (kind === 'last-month') return [ymd(new Date(t.getFullYear(), t.getMonth() - 1, 1)), ymd(new Date(t.getFullYear(), t.getMonth(), 0))];
    return null;   /* all */
  }

  var TH_MONTH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  function thDate(iso) {
    var d = new Date(iso + 'T00:00:00');
    /* 🔴 พ.ศ. = ค.ศ. + 543 เฉย ๆ (เคยใส่สูตรเกินจนได้ปี 3069) */
    return d.getDate() + ' ' + TH_MONTH[d.getMonth()] + ' ' + (d.getFullYear() + 543);
  }

  /* ── รวมตัวเลขของช่วงหนึ่ง ── */
  function sumRange(from, to) {
    var r = { earned: 0, pending: 0, held: 0, future: 0, fee: 0, done: 0, hours: 0, learners: {} };
    LESSONS.forEach(function (L) {
      if (from && to && (L.startAt < startOfDay(from) || L.startAt > endOfDay(to))) return;
      /* 🔴 taught ≠ completed — รายได้นับเฉพาะคาบที่ผู้เรียนยืนยันแล้ว (SYSTEM ข้อ 8) */
      if (L.status === 'completed') {
        r.earned += net(L); r.fee += gross(L) - net(L);
        r.done++; r.hours += L.len / 60; r.learners[L.learnerId || L.learner] = 1;
      } else if (L.status === 'taught') r.pending += net(L);
      /* 🔴 เงินทุกบาทต้องอยู่ในช่องใดช่องหนึ่ง — disputed ห้ามหายจากจอ */
      else if (L.status === 'disputed') r.held += net(L);
      else if (L.status === 'confirmed' || L.status === 'in_progress') r.future += net(L);
    });
    r.nLearners = Object.keys(r.learners).length;
    return r;
  }

  /* ── ช่วงก่อนหน้าที่ "ยาวเท่ากัน" เอาไว้เทียบ % ── */
  function prevRange(from, to) {
    if (!from || !to) return null;
    var f = startOfDay(from), t = endOfDay(to);
    var len = t - f + 1;
    return [ymd(new Date(f - len)), ymd(new Date(f - 1))];
  }

  function delta(now, before) {
    /* ไม่มีของเทียบ = ไม่โม้ ขึ้นขีดไปเลย */
    if (before == null || before === 0) return { txt: now > 0 ? 'ใหม่' : '—', cls: now > 0 ? 'up' : 'flat' };
    var p = Math.round((now - before) / before * 100);
    if (p === 0) return { txt: 'เท่าเดิม', cls: 'flat' };
    return { txt: (p > 0 ? '+' : '') + p + '%', cls: p > 0 ? 'up' : 'down' };
  }

  function statCard(label, value, d, hi, sub, tag) {
    var c = el('div', 'stat' + (hi ? ' is-hi' : '') + (tag ? ' is-wait' : ''));
    var head = el('span', 'stat-k');
    head.appendChild(document.createTextNode(label));
    if (tag) head.appendChild(el('span', 'stat-tag', tag));
    c.appendChild(head);
    c.appendChild(el('b', 'stat-v', value));
    if (d) c.appendChild(el('span', 'stat-d ' + d.cls, d.txt));
    if (sub) c.appendChild(el('span', 'stat-sub', sub));
    return c;
  }

  function paintStats(from, to) {
    var cur = sumRange(from, to);
    var pv = prevRange(from, to);
    var old = pv ? sumRange(pv[0], pv[1]) : null;

    var box = $('stats');
    box.textContent = '';
    /* 🔴 2026-09-04 (Owner) — เลิกใช้คำว่า "ปลดล็อก" มันเป็นศัพท์ระบบ ครูอ่านไม่ออก
       ใช้ "รายได้ที่ได้รับแล้ว" + บอกต่อว่ารอรอบโอน จะได้ไม่เข้าใจว่าเงินเข้าบัญชีแล้ว
       🔴 เงินที่ครูยังไม่ได้ ไม่ใส่วงเล็บ — ในงานบัญชี (784) แปลว่าติดลบ คนอ่านผิดแน่
          ใช้ป้าย "ยังไม่ได้รับ" กำกับแทน ชัดกว่าและไม่ชนกับความหมายเดิม */
    box.appendChild(statCard('รายได้ที่ได้รับแล้ว', baht(cur.earned), old ? delta(cur.earned, old.earned) : null, true, 'รอรอบโอนเข้าบัญชี'));
    box.appendChild(statCard('คาบที่สอนจบ', String(cur.done), old ? delta(cur.done, old.done) : null));
    box.appendChild(statCard('ชั่วโมงที่สอน', String(Math.round(cur.hours * 10) / 10), old ? delta(cur.hours, old.hours) : null));
    box.appendChild(statCard('ผู้เรียนที่สอน', String(cur.nLearners), old ? delta(cur.nLearners, old.nLearners) : null));
    box.appendChild(statCard('รอผู้เรียนยืนยัน', baht(cur.pending), null, false, null, 'ยังไม่ได้รับ'));
    box.appendChild(statCard('ระหว่างตรวจสอบ', baht(cur.held), null, false, null, 'ยังไม่ได้รับ'));
    box.appendChild(statCard('คาบที่ยังไม่ถึงเวลา', baht(cur.future), null, false, null, 'ยังไม่ได้รับ'));
    box.appendChild(statCard('ค่าแพลตฟอร์มที่หัก', baht(cur.fee), null, false, 'หักจากยอดที่ผู้เรียนจ่าย'));

    $('range-label').textContent = (from && to ? thDate(from) + ' – ' + thDate(to) : 'ตั้งแต่เริ่มใช้งาน')
      + (pv ? ' · เทียบกับ ' + thDate(pv[0]) + ' – ' + thDate(pv[1]) : '');

    /* 🔴 ข้อความตอนยังไม่มีคาบ — ครูเปิดวันแรกต้องไม่เจอจอว่างเปล่า */
    $('stat-note').textContent = cur.done === 0
      ? 'ช่วงนี้ยังไม่มีคาบที่สอนจบ — ตัวเลขจะเริ่มขยับทันทีที่ผู้เรียนยืนยันคาบแรก'
      : 'เปอร์เซ็นต์เทียบกับช่วงก่อนหน้าที่ยาวเท่ากัน · รายได้เป็นยอดหลังหักค่าแพลตฟอร์มแล้ว';
  }

  /* ══ ระดับครู — สะสมทั้งชีวิต ไม่ผูกช่วงเวลา ══
     🔴 ยังไม่ผูกส่วนลดค่า GP: MODEL ข้อ 8.5 เขียนล็อกไว้เองว่า "ข้อเสนอ ไม่ใช่ข้อสรุป
        Owner ยังไม่เคาะ · ห้ามเอาตัวเลขในข้อนี้ขึ้นหน้าเว็บ" -> เคาะแล้วเติม fee ในตารางนี้ */
  var TIERS = [
    { at: 0,   name: 'ครูใหม่' },
    { at: 50,  name: 'ครูประจำ' },
    { at: 150, name: 'ครูชำนาญ' },
    { at: 300, name: 'ครูอาวุโส' },
    { at: 600, name: 'ครูผู้เชี่ยวชาญ' }
  ];
  (function paintRank() {
    var all = sumRange(null, null);
    var hours = all.hours;
    var i = 0;
    for (var k = 0; k < TIERS.length; k++) if (hours >= TIERS[k].at) i = k;
    var cur = TIERS[i], next = TIERS[i + 1] || null;

    var box = $('rank');
    var top = el('div', 'rank-top');
    top.appendChild(el('span', 'rank-now', cur.name));
    top.appendChild(el('span', 'rank-next', next
      ? 'อีก ' + (Math.round((next.at - hours) * 10) / 10) + ' ชม. ถึงระดับ “' + next.name + '”'
      : 'ถึงระดับสูงสุดแล้ว'));
    box.appendChild(top);

    /* หลอดวิ่งจากขั้นปัจจุบันไปขั้นถัดไป ไม่ใช่จาก 0 — ครูระดับสูงจะได้ไม่เห็นหลอดเต็มตลอด */
    var from = cur.at, to = next ? next.at : Math.max(hours, cur.at + 1);
    var pct = next ? Math.max(0, Math.min(100, Math.round((hours - from) / (to - from) * 100))) : 100;
    var bar = el('div', 'rank-bar');
    var fill = el('i');
    fill.style.width = pct + '%';
    bar.appendChild(fill);
    box.appendChild(bar);
    box.appendChild(el('p', 'helper', 'สอนสะสมแล้ว ' + (Math.round(hours * 10) / 10) + ' ชั่วโมง'
      + ' · ' + all.done + ' คาบ · ผู้เรียน ' + all.nLearners + ' คน'
      + (next ? ' · ' + pct + '% ของระดับนี้' : '')));

    var scale = el('div', 'rank-scale');
    TIERS.forEach(function (t, k) {
      scale.appendChild(el('span', 'rank-step' + (k === i ? ' is-now' : (k < i ? ' is-got' : '')),
        t.name + ' · ' + t.at + '+ ชม.'));
    });
    box.appendChild(scale);
    box.appendChild(el('p', 'helper',
      'นับเฉพาะคาบที่สอนจบและผู้เรียนยืนยันแล้ว — คาบที่ยังรอยืนยันจะยังไม่ถูกนับ'));
  })();

  /* ══ ที่ตั้งไว้ตอนนี้ — อ่านจาก shared/teacher-data.js (หน้าโปรไฟล์เขียน) ══ */
  (function paintSetup() {
    var d = TD.read(), box = $('setup');
    function row(k, v, sub) {
      var r = el('div', 'setup-row');
      r.appendChild(el('span', 'setup-k', k));
      var val = el('span', 'setup-v');
      val.appendChild(document.createTextNode(v));
      if (sub) val.appendChild(el('small', null, sub));
      r.appendChild(val);
      box.appendChild(r);
    }
    var subj = TD.openSubjects(d), gr = TD.openGrades(d), md = TD.openModes(d);
    var pr = TD.priceRange(d);
    row('วิชาที่เปิดสอน', subj.length ? subj.length + ' วิชา' : 'ยังไม่ได้เปิด', subj.join(' · ') || 'เปิดวิชาก่อน ผู้เรียนถึงจะเจอคุณ');
    row('ระดับชั้น', gr.length ? gr.length + ' ช่วงชั้น' : 'ยังไม่ได้เลือก', gr.join(' · '));
    row('รูปแบบการสอน', md.length ? md.join(' · ') : 'ยังไม่ได้เลือก', '');
    row('ราคาที่ตั้งไว้', pr ? (pr.min === pr.max ? baht(pr.min) : baht(pr.min) + ' – ' + baht(pr.max)) : 'ยังไม่ได้ตั้ง',
        pr ? pr.n + ' รายการ · ต่อชั่วโมง' : 'ตั้งราคาก่อน ผู้เรียนถึงจะกดจองได้');
    row('เวลาว่างต่อสัปดาห์', TD.weeklyHours(d) + ' ชม.', TD.openDays(d) + ' วันที่เปิดรับ');
    row('ยืนยันตัวตน', d.profile.verified ? 'ยืนยันแล้ว' : 'ยังไม่ยืนยัน',
        d.profile.verified ? 'ตรวจเมื่อ ' + d.profile.verifiedAt : 'ส่งเอกสารในหน้าโปรไฟล์');
    row('ประสบการณ์สอน', (d.profile.expYears || 0) + ' ปี', TD.age() != null ? 'อายุ ' + TD.age() + ' ปี' : '');
  })();

  /* 🔴 ห้ามเขียนวันโอนเป็นคำสัญญาจนกว่า Owner จะเคาะ (กฎเหล็กข้อ 1) */
  $('payout-note').appendChild(document.createTextNode('ยอดที่ปลดล็อกแล้วจะเข้า'));
  $('payout-note').appendChild(el('b', null, CONFIG.payoutRoundTh + ' (ยังไม่ประกาศ)'));
  $('payout-note').appendChild(document.createTextNode(
    ' · ค่าแพลตฟอร์มหักจากยอดที่ผู้เรียนจ่าย ' + Math.round(CONFIG.feeSingle * 100) + '% ไม่ได้บวกเพิ่มกับผู้เรียน'
    + ' · ยอดจะปลดล็อกเมื่อผู้เรียนยืนยัน หรือครบ ' + CONFIG.confirmWindowH + ' ชั่วโมงแล้วระบบยืนยันให้เอง'));

  /* ── แถบเลือกช่วง ── */
  (function setupRange() {
    var KEY = 'bgt_earn_range';
    var chips = [].slice.call(document.querySelectorAll('.rchip'));
    var custom = $('range-custom'), fromEl = $('range-from'), toEl = $('range-to');

    function apply(kind) {
      chips.forEach(function (c) { c.classList.toggle('is-on', c.getAttribute('data-range') === kind); });
      custom.hidden = kind !== 'custom';
      var r;
      if (kind === 'custom') {
        if (!fromEl.value || !toEl.value) { var p = presetRange('this-month'); fromEl.value = p[0]; toEl.value = p[1]; }
        /* กรอกกลับหัว = สลับให้เอง ดีกว่าขึ้น error */
        if (fromEl.value > toEl.value) { var t = fromEl.value; fromEl.value = toEl.value; toEl.value = t; }
        r = [fromEl.value, toEl.value];
      } else {
        r = presetRange(kind);
        if (r) { fromEl.value = r[0]; toEl.value = r[1]; }
      }
      paintStats(r ? r[0] : null, r ? r[1] : null);
      try { sessionStorage.setItem(KEY, kind); } catch (e) {}
    }

    chips.forEach(function (c) { c.addEventListener('click', function () { apply(c.getAttribute('data-range')); }); });
    [fromEl, toEl].forEach(function (i) { i.addEventListener('change', function () { apply('custom'); }); });

    var saved = null;
    try { saved = sessionStorage.getItem(KEY); } catch (e) {}
    var ok = ['today','7d','this-month','last-month','all','custom'];
    apply(saved && ok.indexOf(saved) > -1 ? saved : 'this-month');
  })();

  /* ── แท็บ "รายคาบ" ── */
  var money = $('money-list');
  var withMoney = LESSONS.slice().sort(function (a, b) { return b.startAt - a.startAt; });
  $('n-each').textContent = String(withMoney.length);
  if (!withMoney.length) {
    money.appendChild(el('p', 'empty', 'ยังไม่มีคาบเรียน'));
  } else {
    withMoney.forEach(function (L) {
      var row = el('div', 'money-row');
      var k = el('span', 'money-k');
      k.appendChild(el('b', null, L.learner + ' · ' + L.subject));
      k.appendChild(el('small', null,
        [STATUS_LABEL[L.status] || L.status, MODE_LABEL[L.mode] || L.mode, (L.len / 60) + ' ชม.'].join(' · ')));
      row.appendChild(k);
      var v = el('span', 'money-v');
      v.appendChild(el('b', null, baht(net(L))));
      v.appendChild(el('small', null, 'ผู้เรียนจ่าย ' + baht(gross(L))));
      row.appendChild(v);
      money.appendChild(row);
    });
  }

  /* ── สลับแท็บ (ชุดเดียวกับอีก 2 หน้า · hidden ตรง ๆ ห้ามใส่ transition) ── */
  var TABS = ['sum', 'each'];
  function goTab(name) {
    if (TABS.indexOf(name) === -1) name = 'sum';
    TABS.forEach(function (t) {
      var btn = $('tab-' + t), panel = $('panel-' + t), on = t === name;
      btn.classList.toggle('is-on', on);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
      panel.hidden = !on;
    });
  }
  TABS.forEach(function (t) { $('tab-' + t).addEventListener('click', function () { goTab(t); }); });
  $('tab-sum').parentNode.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    var cur = TABS.filter(function (t) { return $('tab-' + t).classList.contains('is-on'); })[0] || 'sum';
    var i = TABS.indexOf(cur) + (e.key === 'ArrowRight' ? 1 : -1);
    var next = TABS[(i + TABS.length) % TABS.length];
    goTab(next); $('tab-' + next).focus(); e.preventDefault();
  });
})();
</script>
</body>
